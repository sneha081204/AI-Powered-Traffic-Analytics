# ViolaWatch Configuration
# Edit these values before running

[database]
host = localhost
port = 3306
user = root
password = <REDACTED_DATABASE_CREDENTIAL>
database = violawatch

[detection]
confidence_threshold = 0.45
frame_skip = 2
save_snapshots = true
snapshot_dir = web/static/snapshots
cooldown_seconds = 10

[camera]
default_source = 0
location = Ramanagara-Bidadi

[server]
host = 0.0.0.0
port = 5000
debug = false
upload_folder = web/static/uploads
max_upload_mb = 500

[models]
# Paths to custom YOLOv8 models (leave blank to use base yolov8n.pt)
helmet_model =
seatbelt_model =
plate_model =
